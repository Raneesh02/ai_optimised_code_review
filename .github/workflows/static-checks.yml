name: Static Checks

on:
  pull_request:
    branches: [ main ]

jobs:
  static-checks:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Pull Request Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run TypeScript Compiler
        run: npx tsc --noEmit
