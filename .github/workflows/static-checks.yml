name: Static Checks

on:
  pull_request:
    branches: [ main ]

jobs:
  static-checks:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Pull Request Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run TypeScript Compiler
        run: npx tsc --noEmit

      - name: Enforce Architecture Guidelines (Grep Checks)
        run: |
          echo "Checking for banned page.waitForTimeout()..."
          ! grep -rn "waitForTimeout" tests/ pages/

          echo "Checking for assertions in Page Objects..."
          ! grep -rn "expect(" pages/

          echo "Checking for raw Playwright imports in test files..."
          ! grep -rn "from '@playwright/test'" tests/ --exclude="auth.setup.ts"

          echo "Checking for missing @regression tags..."
          ! grep -rn "test(" tests/ --exclude="auth.setup.ts" | grep -v "@regression"
