name: AI PR Code Review

on:
  issue_comment:
    types: [created]

jobs:
  ai-review:
    # Run only if the comment is on a Pull Request and contains "code_review"
    if: ${{ github.event.issue.pull_request && contains(github.event.comment.body, 'code_review') }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Pull Request Code (Full History)
        uses: actions/checkout@v4
        with:
          ref: refs/pull/${{ github.event.issue.number }}/head
          fetch-depth: 0 # Fetch all history to perform git diffing

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run AI Review Script
        run: node scripts/ai-review.js
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PR_NUMBER: ${{ github.event.issue.number }}
          REPOSITORY: ${{ github.repository }}
